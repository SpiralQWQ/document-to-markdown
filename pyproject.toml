[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "document-to-markdown"
version = "0.4.0"
description = "Convert PDF/Word/PPT documents to AI-ready Markdown with forced OCR, quality gates and a three-layer QA system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "SpiralQWQ", url = "https://github.com/SpiralQWQ" },
]
keywords = ["pdf", "markdown", "ocr", "mineru", "document-conversion", "rag", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "pymupdf",
    "mistune",
    "camelot-py[base]",
    "pikepdf",
    "requests",  # 云端管线上传/轮询（核心功能）
    "mineru[all]>=2.0.0",  # 解析引擎（本地管线必需）
]

[project.optional-dependencies]
# MinerU parsing engine (heavy; install separately if you want local parsing)
mineru = ["mineru[all]"]
# L3 vision review backends
vision = ["requests"]

[project.urls]
Homepage = "https://github.com/SpiralQWQ/document-to-markdown"
Repository = "https://github.com/SpiralQWQ/document-to-markdown"
Documentation = "https://github.com/SpiralQWQ/document-to-markdown#readme"
Changelog = "https://github.com/SpiralQWQ/document-to-markdown/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
